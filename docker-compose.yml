version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: box-shop-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: boxshop_dev
    ports:
      - '5432:5432'
    volumes:
      - boxshop_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  boxshop_pgdata:
