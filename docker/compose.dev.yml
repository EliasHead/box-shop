version: '3.8'

services:
  app:
    image: node:22-alpine
    container_name: boxshop-web-dev
    working_dir: /app
    volumes:
      - ../:/app
      # Mount um volume anônimo pro node_modules pra não ter conflito de OS (Linux container vs Host)
      - /app/node_modules
      - /app/.next
      - ../data/product-images:/var/lib/boxshop/product-images
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PRODUCT_IMAGES_DIR=/var/lib/boxshop/product-images
      - DATABASE_URL=postgresql://admin:admin_password@db:5432/boxshop_dev
      - NEXT_PUBLIC_ROOT_DOMAIN=localhost:3000
    env_file:
      - path: ../.env
        required: false
    command: sh -c "npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: boxshop-db-dev
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: boxshop_dev
    ports:
      - '5432:5432'
    volumes:
      - boxshop_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d boxshop_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  boxshop_pgdata_dev:
