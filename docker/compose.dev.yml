version: '3.8'

services:
  app:
    image: node:20-alpine
    container_name: boxshop-web-dev
    working_dir: /app
    volumes:
      - ../:/app
      # Mount um volume anônimo pro node_modules pra não ter conflito de OS (Linux container vs Host)
      - /app/node_modules
      - /app/.next
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://admin:admin_password@db:5432/boxshop_dev
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: boxshop-db-dev
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: boxshop_dev
    ports:
      - '5432:5432'
    volumes:
      - boxshop_pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  boxshop_pgdata_dev:
